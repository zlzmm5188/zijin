<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>强制刷新缓存</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
body{margin:0;padding:40px;font-family:system-ui;background:#0e2b44;color:#fff;text-align:center}
.box{max-width:600px;margin:0 auto;background:rgba(255,255,255,0.1);padding:40px;border-radius:16px}
h1{color:#f5d771;margin-bottom:30px}
.btn{display:inline-block;padding:15px 40px;background:#f5d771;color:#0e2b44;border-radius:8px;text-decoration:none;font-weight:bold;margin:10px}
.info{background:rgba(255,255,255,0.05);padding:20px;border-radius:8px;margin:20px 0;text-align:left}
</style>
</head>
<body>
<div class="box">
<h1>🔄 强制刷新缓存</h1>
<p>系统已更新，请按以下步骤清除缓存：</p>
<div class="info">
<p><strong>Windows/Linux:</strong><br>按 <code>Ctrl + Shift + R</code></p>
<p><strong>Mac:</strong><br>按 <code>Cmd + Shift + R</code></p>
<p><strong>或者：</strong><br>按 <code>Ctrl + F5</code> (Windows)</p>
</div>
<a href="index.html?v=99999999" class="btn">刷新后进入首页</a>
<a href="login.html?v=99999999" class="btn">刷新后去登录</a>
<p style="margin-top:30px;font-size:12px;color:#8b9aa8">
所有JS版本号已更新为: 99999999<br>
API域名已更新为: copla.top
</p>
</div>
<script>
// 清除localStorage
try{
    const token = localStorage.getItem('providence_token');
    localStorage.clear();
    if(token) localStorage.setItem('providence_token', token);
    console.log('✅ localStorage已清除（保留token）');
}catch(e){}

// 强制重新加载所有资源
if(performance.navigation.type !== 1){
    setTimeout(()=>{
        location.reload(true);
    }, 100);
}
</script>
</body>
</html>
