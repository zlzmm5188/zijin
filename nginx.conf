worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    server {
        listen 8080;
        server_name _;

        # Frontend (mobile web app)
        root /app/providence;
        index index.php index.html;

        # Handle OPTIONS preflight requests with validated origins
        set $cors_origin "";
        if ($http_origin ~* "^https?://(copla\.top|([a-zA-Z0-9-]+\.)?frevix\.top|localhost(:[0-9]+)?)$") {
            set $cors_origin $http_origin;
        }
        
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization, token, sign, timestamp' always;
            add_header Access-Control-Allow-Credentials 'true' always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # Frontend routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # PHP files in frontend - restrict to safe paths only
        location ~ ^/([a-zA-Z0-9_-]+/)*[a-zA-Z0-9_-]+\.php$ {
            # Block path traversal attempts
            if ($uri ~* "\.\.") {
                return 403;
            }
            # Block hidden files
            if ($uri ~* "/\.") {
                return 403;
            }
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Admin panel
        location /providence-admin/ {
            alias /app/providence-admin/;
            index index.html index.php;

            location ~ \.php$ {
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /app/providence-admin$fastcgi_script_name;
                include fastcgi_params;
            }
        }

        # API routes
        location /providence-admin/api/ {
            alias /app/providence-admin/api/;
            index index.php;

            try_files $uri $uri/ /providence-admin/api/index.php?$query_string;

            location ~ \.php$ {
                fastcgi_pass 127.0.0.1:9000;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /app/providence-admin/api$fastcgi_script_name;
                include fastcgi_params;
            }
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
        }

        # Deny access to sensitive files
        location ~ \.(env|log|sql)$ {
            deny all;
        }
    }
}
