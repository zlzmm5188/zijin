<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员管理</title>
    <link rel="stylesheet" href="../public/css/srs-design-system.css">
    <style>
        body { padding: 20px; background: #f7f8fa; margin: 0; font-family: -apple-system, sans-serif; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title { font-size: 20px; font-weight: 700; color: #1a2332; }
        .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(90deg, #0b3b5e, #145a8a); color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(11,59,94,0.3); }
        .btn-success { background: #25d0a6; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .form-input { padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px; min-width: 180px; }
        .form-select { padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px; min-width: 120px; background: #fff; }
        .table-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
        th { background: #f8fafc; font-weight: 600; color: #64748b; font-size: 13px; }
        tr:hover { background: #fafbfc; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-success { background: #dcfce7; color: #16a34a; }
        .badge-danger { background: #fee2e2; color: #dc2626; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 20px; }
        .page-btn { padding: 8px 12px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; cursor: pointer; }
        .page-btn.active { background: #0b3b5e; color: #fff; border-color: #0b3b5e; }
        
        /* 弹窗样式 */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: #fff; border-radius: 12px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .form-input-full { width: 100%; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="page-header">
        <h2 class="page-title">👤 管理员管理</h2>
        <button class="btn btn-primary" onclick="openAddModal()">➕ 添加管理员</button>
    </div>

    <div class="toolbar">
        <input type="text" class="form-input" id="keyword" placeholder="搜索用户名/姓名">
        <select class="form-select" id="roleFilter">
            <option value="">全部角色</option>
        </select>
        <select class="form-select" id="statusFilter">
            <option value="">全部状态</option>
            <option value="1">正常</option>
            <option value="0">禁用</option>
        </select>
        <button class="btn btn-primary" onclick="loadData()">🔍 搜索</button>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>姓名</th>
                    <th>角色</th>
                    <th>手机号</th>
                    <th>状态</th>
                    <th>最后登录</th>
                    <th>登录次数</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="dataList"></tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>

    <!-- 编辑弹窗 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">添加管理员</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label class="form-label">用户名 *</label>
                        <input type="text" class="form-input-full" id="editUsername" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">密码 <span id="pwdHint">(留空则不修改)</span></label>
                        <input type="password" class="form-input-full" id="editPassword" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label class="form-label">真实姓名</label>
                        <input type="text" class="form-input-full" id="editRealName">
                    </div>
                    <div class="form-group">
                        <label class="form-label">手机号</label>
                        <input type="text" class="form-input-full" id="editPhone">
                    </div>
                    <div class="form-group">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-input-full" id="editEmail">
                    </div>
                    <div class="form-group">
                        <label class="form-label">角色</label>
                        <select class="form-input-full" id="editRole"></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">状态</label>
                        <select class="form-input-full" id="editStatus">
                            <option value="1">正常</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveData()">保存</button>
            </div>
        </div>
    </div>

<script>
const API_BASE = '../api';
let currentPage = 1;
let roles = [];

// 加载角色列表
async function loadRoles() {
    try {
        const res = await fetch(`${API_BASE}/admin/roles`);
        const data = await res.json();
        if (data.code === 1) {
            roles = data.data.data || [];
            const roleFilter = document.getElementById('roleFilter');
            const editRole = document.getElementById('editRole');
            
            roles.forEach(role => {
                roleFilter.innerHTML += `<option value="${role.id}">${role.name}</option>`;
                editRole.innerHTML += `<option value="${role.id}">${role.name}</option>`;
            });
        }
    } catch (e) {
        console.error('加载角色失败', e);
    }
}

// 加载数据
async function loadData(page = 1) {
    currentPage = page;
    const keyword = document.getElementById('keyword').value;
    const roleId = document.getElementById('roleFilter').value;
    const status = document.getElementById('statusFilter').value;

    try {
        const params = new URLSearchParams({
            page,
            limit: 20,
            keyword,
            role_id: roleId,
            status
        });

        const res = await fetch(`${API_BASE}/admin/admins?${params}`);
        const data = await res.json();

        if (data.code === 1) {
            renderTable(data.data.data || []);
            renderPagination(data.data.count || 0, page);
        }
    } catch (e) {
        console.error('加载数据失败', e);
    }
}

function renderTable(list) {
    const tbody = document.getElementById('dataList');
    if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;padding:40px;">暂无数据</td></tr>';
        return;
    }

    tbody.innerHTML = list.map(item => `
        <tr>
            <td>${item.id}</td>
            <td><strong>${item.username}</strong></td>
            <td>${item.real_name || '-'}</td>
            <td><span class="badge badge-success">${item.role_name || '-'}</span></td>
            <td>${item.phone || '-'}</td>
            <td><span class="badge ${item.status === 1 ? 'badge-success' : 'badge-danger'}">${item.status_text}</span></td>
            <td>${item.last_login_at || '从未登录'}</td>
            <td>${item.login_count}</td>
            <td>
                <button class="btn btn-primary btn-sm" onclick="editItem(${item.id})">编辑</button>
                ${item.id !== 1 ? `<button class="btn btn-danger btn-sm" onclick="toggleStatus(${item.id}, ${item.status})">
                    ${item.status === 1 ? '禁用' : '启用'}
                </button>` : ''}
            </td>
        </tr>
    `).join('');
}

function renderPagination(total, current) {
    const totalPages = Math.ceil(total / 20);
    const pagination = document.getElementById('pagination');
    
    if (totalPages <= 1) {
        pagination.innerHTML = '';
        return;
    }

    let html = '';
    for (let i = 1; i <= Math.min(totalPages, 10); i++) {
        html += `<button class="page-btn ${i === current ? 'active' : ''}" onclick="loadData(${i})">${i}</button>`;
    }
    pagination.innerHTML = html;
}

function openAddModal() {
    document.getElementById('editId').value = '';
    document.getElementById('editUsername').value = '';
    document.getElementById('editPassword').value = '';
    document.getElementById('editRealName').value = '';
    document.getElementById('editPhone').value = '';
    document.getElementById('editEmail').value = '';
    document.getElementById('editRole').value = '1';
    document.getElementById('editStatus').value = '1';
    document.getElementById('modalTitle').textContent = '添加管理员';
    document.getElementById('pwdHint').style.display = 'none';
    document.getElementById('editModal').classList.add('show');
}

async function editItem(id) {
    // 从列表获取数据
    const res = await fetch(`${API_BASE}/admin/admins?keyword=&page=1&limit=100`);
    const data = await res.json();
    if (data.code === 1) {
        const item = data.data.data.find(i => i.id === id);
        if (item) {
            document.getElementById('editId').value = item.id;
            document.getElementById('editUsername').value = item.username;
            document.getElementById('editPassword').value = '';
            document.getElementById('editRealName').value = item.real_name || '';
            document.getElementById('editPhone').value = item.phone || '';
            document.getElementById('editEmail').value = item.email || '';
            document.getElementById('editRole').value = item.role_id;
            document.getElementById('editStatus').value = item.status;
            document.getElementById('modalTitle').textContent = '编辑管理员';
            document.getElementById('pwdHint').style.display = 'inline';
            document.getElementById('editModal').classList.add('show');
        }
    }
}

function closeModal() {
    document.getElementById('editModal').classList.remove('show');
}

async function saveData() {
    const id = document.getElementById('editId').value;
    const data = {
        id: id ? parseInt(id) : 0,
        username: document.getElementById('editUsername').value,
        password: document.getElementById('editPassword').value,
        real_name: document.getElementById('editRealName').value,
        phone: document.getElementById('editPhone').value,
        email: document.getElementById('editEmail').value,
        role_id: parseInt(document.getElementById('editRole').value),
        status: parseInt(document.getElementById('editStatus').value)
    };

    if (!data.username) {
        alert('请填写用户名');
        return;
    }

    if (!id && !data.password) {
        alert('请填写密码');
        return;
    }

    try {
        const res = await fetch(`${API_BASE}/admin/admin-save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.code === 1) {
            alert(result.msg || '保存成功');
            closeModal();
            loadData(currentPage);
        } else {
            alert(result.msg || '保存失败');
        }
    } catch (e) {
        alert('保存失败');
    }
}

async function toggleStatus(id, currentStatus) {
    if (!confirm(currentStatus === 1 ? '确定要禁用此管理员？' : '确定要启用此管理员？')) return;

    try {
        const res = await fetch(`${API_BASE}/admin/admin-save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status: currentStatus === 1 ? 0 : 1 })
        });
        const result = await res.json();
        if (result.code === 1) {
            loadData(currentPage);
        } else {
            alert(result.msg || '操作失败');
        }
    } catch (e) {
        alert('操作失败');
    }
}

// 初始化
loadRoles();
loadData();
</script>
</body>
</html>
