<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>投资课堂</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.8.18/css/layui.css">
</head>
<body>
    <div style="padding: 20px;">
        <h2>投资课堂管理</h2>
        <button class="layui-btn" id="addBtn">发布课程</button>
        <table class="layui-table">
            <thead>
                <tr><th>ID</th><th>标题</th><th>分类</th><th>难度</th><th>状态</th><th>浏览量</th><th>操作</th></tr>
            </thead>
            <tbody>
                <tr><td>1</td><td>股权投资入门</td><td>基础</td><td>入门</td><td>已发布</td><td>1234</td><td><button class="layui-btn layui-btn-xs">编辑</button></td></tr>
            </tbody>
        </table>
    </div>
    <script src="https://cdn.staticfile.org/layui/2.8.18/layui.js"></script>
    <script>
    layui.use('layer', function(){
        var layer = layui.layer;
        document.getElementById('addBtn').onclick = function(){
            layer.msg('发布功能开发中...');
        };
    });
    </script>
</body>
</html>
