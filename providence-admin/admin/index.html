<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PROVIDENCE 管理后台</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {--primary:#0b3b5e;--accent:#c99b2b;--bg:#f7f8fa;}
        body,html{margin:0;padding:0;height:100%;overflow:hidden;font-family:-apple-system,sans-serif;}
        .layout{display:flex;height:100vh;flex-direction:column;}
        .header{background:linear-gradient(180deg,#0e2b44,#091c2e);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1000;}
        .logo{color:#e8edf3;font-size:20px;font-weight:700;letter-spacing:1.5px;}
        .user{color:rgba(232,237,243,0.8);font-size:14px;}
        .btn-logout{background:rgba(255,255,255,0.1);color:#e8edf3;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;margin-left:12px;}
        .btn-menu-toggle{display:none;background:rgba(255,255,255,0.1);color:#e8edf3;border:none;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:18px;margin-right:12px;}
        .main{display:flex;flex:1;overflow:hidden;position:relative;}
        .sidebar{width:240px;background:linear-gradient(180deg,#0e2b44,#091c2e);overflow-y:auto;transition:transform 0.3s ease;position:relative;z-index:999;}
        .menu{padding:16px 0;}
        .menu-title{padding:12px 20px;font-size:11px;font-weight:600;color:rgba(232,237,243,0.5);text-transform:uppercase;}
        .menu-item{display:block;padding:12px 20px;color:rgba(232,237,243,0.8);text-decoration:none;font-size:14px;border-left:3px solid transparent;}
        .menu-item:hover,.menu-item.active{background:rgba(255,255,255,0.1);color:#e8edf3;border-left-color:#c99b2b;}
        .body{flex:1;background:var(--bg);overflow:hidden;}
        .frame{width:100%;height:100%;border:none;}
        .footer{background:#fff;padding:12px;text-align:center;font-size:12px;color:#6b7a8a;}
        .sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:998;}

        /* 移动端自适应 */
        @media (max-width: 768px) {
            .btn-menu-toggle{display:block;}
            .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);z-index:999;}
            .sidebar.open{transform:translateX(0);}
            .sidebar-overlay{display:block;}
            .body{width:100%;}
            .header{padding:12px 16px;}
            .logo{font-size:16px;}
            .user{font-size:12px;}
            .btn-logout{padding:6px 12px;font-size:12px;margin-left:8px;}
            .menu-item{padding:14px 20px;font-size:15px;}
            .footer{padding:8px;font-size:11px;}
        }
        @media (max-width: 480px) {
            .logo{font-size:14px;letter-spacing:0.5px;}
            .sidebar{width:260px;}
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="header">
            <button class="btn-menu-toggle" onclick="toggleSidebar()">☰</button>
            <div class="logo">PROVIDENCE 管理系统</div>
            <div>
                <span class="user" id="user">管理员</span>
                <button class="btn-logout" onclick="logout()">退出</button>
            </div>
        </div>
        <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
        <div class="main">
            <div class="sidebar">
                <div class="menu">
                    <div class="menu-title">首页</div>
                    <a href="dashboard.html" target="content" class="menu-item">📊 数据概览</a>
                    <a href="reports.html" target="content" class="menu-item">📈 数据报表</a>

                    <div class="menu-title">用户管理</div>
                    <a href="users.html" target="content" class="menu-item">👥 用户列表</a>
                    <a href="kyc-review.html" target="content" class="menu-item">📋 实名审核</a>
                    <a href="vip.html" target="content" class="menu-item">⭐ VIP等级</a>
                    <a href="login-logs.html" target="content" class="menu-item">📝 登录记录</a>
                    <a href="team-tree.html" target="content" class="menu-item">🌳 推荐分布图</a>

                    <div class="menu-title">项目管理</div>
                    <a href="projects.html" target="content" class="menu-item">📁 项目列表</a>
                    <a href="orders.html" target="content" class="menu-item">📋 投资订单</a>
                    <a href="ribao-management.html" target="content" class="menu-item">💎 日利宝管理</a>

                    <div class="menu-title">财务管理</div>
                    <a href="recharge.html" target="content" class="menu-item">💰 充值审核</a>
                    <a href="withdraw.html" target="content" class="menu-item">💸 提现审核</a>
                    <a href="wallet-logs.html" target="content" class="menu-item">📊 资金流水</a>
                    <a href="balance-adjust.html" target="content" class="menu-item">⚖️ 资产调账</a>

                    <div class="menu-title">营销管理</div>
                    <a href="tasks.html" target="content" class="menu-item">🎯 任务中心</a>
                    <a href="invite-rewards.html" target="content" class="menu-item">🎁 邀请奖励</a>

                    <div class="menu-title">系统配置</div>
                    <a href="payment-config.html" target="content" class="menu-item">💳 支付通道</a>
                    <a href="sms-config.html" target="content" class="menu-item">📱 短信配置</a>
                    <a href="admins-manage.html" target="content" class="menu-item">👤 管理员管理</a>
                </div>
            </div>
            <div class="body">
                <iframe name="content" id="contentFrame" src="dashboard.html" class="frame"></iframe>
            </div>
        </div>
        <div class="footer">© 2024 PROVIDENCE - SRS v1.0</div>
    </div>
    <script>
    // Token验证
    if(!localStorage.getItem('admin_token')) location.href='login.html';
    document.getElementById('user').textContent=localStorage.getItem('admin_user')||'管理员';

    // 退出登录
    function logout(){
        if(confirm('确定退出？')){
            localStorage.clear();
            location.href='login.html';
        }
    }

    // 移动端侧边栏切换
    function toggleSidebar(){
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        sidebar.classList.toggle('open');
        overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
    }

    // 点击菜单项后关闭侧边栏（移动端）
    document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', function(){
            if(window.innerWidth <= 768){
                setTimeout(() => toggleSidebar(), 100);
            }
        });
    });

    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    // 【核心功能】页面刷新后保持当前位置
    // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

    const iframe = document.getElementById('contentFrame');
    const menuItems = document.querySelectorAll('.menu-item');

    // 恢复上次访问的页面
    const lastPage = localStorage.getItem('admin_last_page');
    if (lastPage && lastPage !== 'dashboard.html') {
        iframe.src = lastPage;
        // 高亮对应菜单项
        menuItems.forEach(item => {
            if (item.getAttribute('href') === lastPage) {
                item.classList.add('active');
            }
        });
    } else {
        // 默认高亮首页
        const firstItem = document.querySelector('.menu-item[href="dashboard.html"]');
        if (firstItem) firstItem.classList.add('active');
    }

    // 监听菜单点击，保存当前页面
    menuItems.forEach(item => {
        item.addEventListener('click', function(e) {
            const page = this.getAttribute('href');

            // 保存当前页面到localStorage
            localStorage.setItem('admin_last_page', page);

            // 移除所有active
            menuItems.forEach(m => m.classList.remove('active'));

            // 添加当前active
            this.classList.add('active');
        });
    });

    // 监听iframe加载完成，更新菜单高亮
    iframe.addEventListener('load', function() {
        try {
            const currentSrc = this.contentWindow.location.pathname.split('/').pop();
            if (currentSrc) {
                localStorage.setItem('admin_last_page', currentSrc);

                // 更新菜单高亮
                menuItems.forEach(item => {
                    item.classList.remove('active');
                    if (item.getAttribute('href') === currentSrc) {
                        item.classList.add('active');
                    }
                });
            }
        } catch (e) {
            // 跨域限制，忽略
        }
    });
    </script>
</body>
</html>
