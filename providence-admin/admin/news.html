<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>新闻快讯</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.8.18/css/layui.css">
</head>
<body>
    <div style="padding: 20px;">
        <h2>新闻快讯管理</h2>
        <button class="layui-btn" id="addBtn">发布快讯</button>
        <table class="layui-table">
            <thead>
                <tr><th>ID</th><th>标题</th><th>来源</th><th>重要性</th><th>状态</th><th>发布时间</th><th>操作</th></tr>
            </thead>
            <tbody>
                <tr><td>1</td><td>央行降准释放流动性</td><td>财经网</td><td><span class="layui-badge layui-bg-red">紧急</span></td><td>已发布</td><td>2024-11-10 10:00</td><td><button class="layui-btn layui-btn-xs">编辑</button></td></tr>
            </tbody>
        </table>
    </div>
    <script src="https://cdn.staticfile.org/layui/2.8.18/layui.js"></script>
    <script>
    layui.use('layer', function(){
        var layer = layui.layer;
        document.getElementById('addBtn').onclick = function(){
            layer.msg('发布功能开发中...');
        };
    });
    </script>
</body>
</html>
