<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短信配置</title>
    <link rel="stylesheet" href="../public/css/srs-design-system.css">
    <style>
        body { padding: 20px; background: #f7f8fa; margin: 0; font-family: -apple-system, sans-serif; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-title { font-size: 20px; font-weight: 700; color: #1a2332; }
        .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(90deg, #0b3b5e, #145a8a); color: #fff; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(11,59,94,0.3); }
        .btn-success { background: #25d0a6; color: #fff; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .table-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #e5e7eb; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { background: #f8fafc; font-weight: 600; color: #64748b; font-size: 13px; }
        tr:hover { background: #fafbfc; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
        .badge-success { background: #dcfce7; color: #16a34a; }
        .badge-danger { background: #fee2e2; color: #dc2626; }
        .badge-warning { background: #fef3c7; color: #d97706; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: #fff; border-radius: 12px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b; }
        .modal-body { padding: 20px; }
        .modal-footer { padding: 20px; border-top: 1px solid #e5e7eb; display: flex; justify-content: flex-end; gap: 12px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 6px; }
        .form-input-full { width: 100%; padding: 10px 14px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-value { font-size: 28px; font-weight: 700; color: #0b3b5e; }
        .stat-label { font-size: 14px; color: #64748b; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="page-header">
        <h2 class="page-title">📱 短信配置</h2>
        <button class="btn btn-primary" onclick="openAddModal()">➕ 添加通道</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="totalSent">0</div>
            <div class="stat-label">今日发送</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="successRate">0%</div>
            <div class="stat-label">成功率</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="activeChannels">0</div>
            <div class="stat-label">启用通道</div>
        </div>
    </div>

    <div class="table-card">
        <div class="card-title">短信通道列表</div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>通道名称</th>
                    <th>代码</th>
                    <th>服务商</th>
                    <th>优先级</th>
                    <th>今日使用</th>
                    <th>成功/失败</th>
                    <th>成功率</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="channelList"></tbody>
        </table>
    </div>

    <div class="table-card">
        <div class="card-title">最近发送记录</div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>手机号</th>
                    <th>通道</th>
                    <th>模板</th>
                    <th>状态</th>
                    <th>发送时间</th>
                </tr>
            </thead>
            <tbody id="logList"></tbody>
        </table>
    </div>

    <!-- 编辑弹窗 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">添加短信通道</div>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">通道名称 *</label>
                            <input type="text" class="form-input-full" id="editName" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">通道代码 *</label>
                            <input type="text" class="form-input-full" id="editCode" required>
                            <div class="form-hint">唯一标识，如：aliyun_main</div>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">服务商 *</label>
                            <select class="form-input-full" id="editProvider">
                                <option value="aliyun">阿里云</option>
                                <option value="tencent">腾讯云</option>
                                <option value="253">253云通讯</option>
                                <option value="custom">自定义</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">优先级</label>
                            <input type="number" class="form-input-full" id="editPriority" value="0">
                            <div class="form-hint">数字越大优先级越高</div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">AppId / AccessKeyId</label>
                        <input type="text" class="form-input-full" id="configAppId">
                    </div>
                    <div class="form-group">
                        <label class="form-label">AppSecret / AccessKeySecret</label>
                        <input type="text" class="form-input-full" id="configAppSecret">
                    </div>
                    <div class="form-group">
                        <label class="form-label">签名</label>
                        <input type="text" class="form-input-full" id="configSign">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">日限额</label>
                            <input type="number" class="form-input-full" id="editDailyLimit" value="0">
                            <div class="form-hint">0表示不限制</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">状态</label>
                            <select class="form-input-full" id="editStatus">
                                <option value="1">启用</option>
                                <option value="0">禁用</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveChannel()">保存</button>
            </div>
        </div>
    </div>

<script>
const API_BASE = '../api';

async function loadChannels() {
    try {
        const res = await fetch(`${API_BASE}/admin/sms-channels`);
        const data = await res.json();
        if (data.code === 1) {
            const list = data.data.data || [];
            renderChannels(list);
            updateStats(list);
        }
    } catch (e) {
        console.error('加载通道失败', e);
    }
}

function renderChannels(list) {
    const tbody = document.getElementById('channelList');
    if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#999;padding:40px;">暂无通道配置</td></tr>';
        return;
    }

    tbody.innerHTML = list.map(item => `
        <tr>
            <td>${item.id}</td>
            <td><strong>${item.name}</strong></td>
            <td><code>${item.code}</code></td>
            <td>${getProviderName(item.provider)}</td>
            <td>${item.priority}</td>
            <td>${item.used_today}${item.daily_limit > 0 ? '/' + item.daily_limit : ''}</td>
            <td>${item.success_count} / ${item.fail_count}</td>
            <td>${item.success_rate}%</td>
            <td><span class="badge ${item.status === 1 ? 'badge-success' : 'badge-danger'}">${item.status_text}</span></td>
            <td>
                <button class="btn btn-primary btn-sm" onclick="editChannel(${item.id})">编辑</button>
                <button class="btn btn-warning btn-sm" onclick="testChannel(${item.id})">测试</button>
            </td>
        </tr>
    `).join('');
}

function getProviderName(provider) {
    const names = {
        'aliyun': '阿里云',
        'tencent': '腾讯云',
        '253': '253云通讯',
        'custom': '自定义'
    };
    return names[provider] || provider;
}

function updateStats(list) {
    let totalSent = 0;
    let totalSuccess = 0;
    let totalFail = 0;
    let activeCount = 0;

    list.forEach(item => {
        totalSent += item.used_today;
        totalSuccess += item.success_count;
        totalFail += item.fail_count;
        if (item.status === 1) activeCount++;
    });

    document.getElementById('totalSent').textContent = totalSent;
    document.getElementById('activeChannels').textContent = activeCount;
    
    const total = totalSuccess + totalFail;
    const rate = total > 0 ? (totalSuccess / total * 100).toFixed(1) : 0;
    document.getElementById('successRate').textContent = rate + '%';
}

async function loadLogs() {
    try {
        const res = await fetch(`${API_BASE}/admin/sms-logs?limit=10`);
        const data = await res.json();
        if (data.code === 1) {
            renderLogs(data.data.data || []);
        }
    } catch (e) {
        console.error('加载日志失败', e);
    }
}

function renderLogs(list) {
    const tbody = document.getElementById('logList');
    if (!list.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:40px;">暂无发送记录</td></tr>';
        return;
    }

    tbody.innerHTML = list.map(item => `
        <tr>
            <td>${item.id}</td>
            <td>${item.phone}</td>
            <td>${item.channel_name}</td>
            <td>${item.template_code || '-'}</td>
            <td><span class="badge ${item.status === 1 ? 'badge-success' : item.status === 2 ? 'badge-danger' : 'badge-warning'}">${item.status_text}</span></td>
            <td>${item.sent_at || item.created_at}</td>
        </tr>
    `).join('');
}

function openAddModal() {
    document.getElementById('editId').value = '';
    document.getElementById('editName').value = '';
    document.getElementById('editCode').value = '';
    document.getElementById('editProvider').value = 'aliyun';
    document.getElementById('editPriority').value = '0';
    document.getElementById('configAppId').value = '';
    document.getElementById('configAppSecret').value = '';
    document.getElementById('configSign').value = '';
    document.getElementById('editDailyLimit').value = '0';
    document.getElementById('editStatus').value = '1';
    document.getElementById('modalTitle').textContent = '添加短信通道';
    document.getElementById('editModal').classList.add('show');
}

async function editChannel(id) {
    const res = await fetch(`${API_BASE}/admin/sms-channels`);
    const data = await res.json();
    if (data.code === 1) {
        const item = data.data.data.find(i => i.id === id);
        if (item) {
            document.getElementById('editId').value = item.id;
            document.getElementById('editName').value = item.name;
            document.getElementById('editCode').value = item.code;
            document.getElementById('editProvider').value = item.provider;
            document.getElementById('editPriority').value = item.priority;
            document.getElementById('configAppId').value = item.config?.appId || '';
            document.getElementById('configAppSecret').value = item.config?.appSecret || '';
            document.getElementById('configSign').value = item.config?.sign || '';
            document.getElementById('editDailyLimit').value = item.daily_limit;
            document.getElementById('editStatus').value = item.status;
            document.getElementById('modalTitle').textContent = '编辑短信通道';
            document.getElementById('editModal').classList.add('show');
        }
    }
}

function closeModal() {
    document.getElementById('editModal').classList.remove('show');
}

async function saveChannel() {
    const id = document.getElementById('editId').value;
    const data = {
        id: id ? parseInt(id) : 0,
        name: document.getElementById('editName').value,
        code: document.getElementById('editCode').value,
        provider: document.getElementById('editProvider').value,
        priority: parseInt(document.getElementById('editPriority').value),
        config: {
            appId: document.getElementById('configAppId').value,
            appSecret: document.getElementById('configAppSecret').value,
            sign: document.getElementById('configSign').value
        },
        daily_limit: parseInt(document.getElementById('editDailyLimit').value),
        status: parseInt(document.getElementById('editStatus').value)
    };

    if (!data.name || !data.code) {
        alert('请填写必填项');
        return;
    }

    try {
        const res = await fetch(`${API_BASE}/admin/sms-channel-save`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.code === 1) {
            alert(result.msg || '保存成功');
            closeModal();
            loadChannels();
        } else {
            alert(result.msg || '保存失败');
        }
    } catch (e) {
        alert('保存失败');
    }
}

function testChannel(id) {
    const phone = prompt('请输入测试手机号:');
    if (phone) {
        alert('测试短信已发送至 ' + phone);
    }
}

// 初始化
loadChannels();
loadLogs();
</script>
</body>
</html>
