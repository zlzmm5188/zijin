<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>统计报表</title>
    <link rel="stylesheet" href="https://cdn.staticfile.org/layui/2.8.18/css/layui.css">
</head>
<body>
    <div style="padding: 20px;">
        <h2>数据统计分析</h2>
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header">用户统计</div>
                    <div class="layui-card-body">
                        <p>总用户数: 156</p>
                        <p>今日新增: 5</p>
                        <p>活跃用户: 89</p>
                    </div>
                </div>
            </div>
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header">资金统计</div>
                    <div class="layui-card-body">
                        <p>总投资额: ¥1,234,567</p>
                        <p>今日充值: ¥50,000</p>
                        <p>今日提现: ¥30,000</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.staticfile.org/layui/2.8.18/layui.js"></script>
</body>
</html>
