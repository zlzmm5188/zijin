<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>VIP等级</title>
<style>
:root{--primary:#0b3b5e}
body{padding:20px;background:#f7f8fa;font-family:-apple-system,sans-serif}
table{width:100%;background:#fff;border-radius:12px;overflow:hidden}
th{background:var(--primary);color:#fff;padding:12px;text-align:left}
td{padding:12px;border-bottom:1px solid #f3f4f6}
</style>
</head>
<body>
<h2>VIP等级管理</h2>
<table><thead><tr><th>等级</th><th>名称</th><th>投资要求</th><th>额外加息</th><th>一级推荐</th><th>二级推荐</th></tr></thead>
<tbody id="list"><tr><td colspan="6" style="text-align:center;padding:40px">加载中...</td></tr></tbody></table>
<script>
fetch('../api/user/level/list').then(r=>r.json()).then(d=>{
let html='';
if(d.code===1&&d.data){
d.data.forEach(v=>{
html+=`<tr><td>VIP${v.vip_level}</td><td>${v.vip_name}</td><td>¥${(v.min_invest||0).toLocaleString()}</td><td style="color:#25d0a6;font-weight:600">${v.extra_rate_display||'+0%'}</td><td>${v.level1_percent||0}%</td><td>${v.level2_percent||0}%</td></tr>`;
});
}else{html='<tr><td colspan="6" style="text-align:center">暂无数据</td></tr>';}
document.getElementById('list').innerHTML=html;
});
</script>
</body>
</html>
