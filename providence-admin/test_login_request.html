<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试登录请求</title>
</head>
<body>
    <h1>测试登录请求</h1>
    <button onclick="testLogin()">测试登录</button>
    <pre id="result"></pre>
    
    <script>
    async function testLogin() {
        const resultEl = document.getElementById('result');
        resultEl.textContent = '发送请求中...';
        
        const username = 'G138688';
        const password = 'Test@123';
        
        try {
            console.log('请求数据:', { username, password, system: 1 });
            
            const response = await fetch('https://api.frevix.top/login/login/account', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password, system: 1 })
            });
            
            console.log('响应状态:', response.status);
            console.log('响应头:', [...response.headers.entries()]);
            
            const text = await response.text();
            console.log('响应文本:', text);
            
            let data;
            try {
                data = JSON.parse(text);
            } catch (e) {
                resultEl.textContent = '解析失败:\n' + text.substring(0, 500);
                return;
            }
            
            resultEl.textContent = JSON.stringify(data, null, 2);
            
        } catch (error) {
            console.error('请求错误:', error);
            resultEl.textContent = '错误: ' + error.message;
        }
    }
    </script>
</body>
</html>
