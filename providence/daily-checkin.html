<html lang="zh-CN">

<head>

        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>每日签到 - Providence</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            overflow: hidden
        }

        body {

            background-position: center top 0px;
            background-repeat: no-repeat;

        body::before {

        }

        /* 顶部 - 毛玻璃效果 */
        .top {
            background: rgba(14, 43, 68, 0.8);
            backdrop-filter: blur(20px);
            padding: max(12px, env(safe-area-inset-top)) 16px 20px;
            position: relative;
            z-index: 10;
            overflow: hidden;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .top::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(120% 180% at -10% -20%, rgba(255, 255, 255, 0.1), transparent 65%),
                radial-gradient(140% 160% at 110% -10%, rgba(255, 255, 255, 0.05), transparent 58%);
            pointer-events: none;
        }

        .top-bar {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .back-btn {
            color: #fff;
            font-size: 28px;
            
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }

        .refresh-btn {
            color: #fff;
            font-size: 13px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            cursor: pointer;
        }

        /* 签到概览卡片 */
        .overview {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .ocard {
            
        }

        .olabel {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
        }

        .ovalue {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }

        .ovalue.gold {
            color: #fbbf24
        }

        /* 内容区 */
        .main {
            padding: 16px;
            height: calc(100vh - 180px - 60px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            position: relative;
            z-index: 1;
            overflow-y: auto;
        }

        /* 月份导航 */
        .month-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 16px;
            
        }

        .mnav {
            color: #D9B45D;
            font-size: 26px;
            
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(217, 180, 93, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(217, 180, 93, 0.3);
        }

        .mnav:active {
            transform: scale(0.9)
        }

        .mname {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            min-
            
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* 签到日历 - 透明背景 */
        .cal {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 20px 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
            position: relative;
            
            margin: 0 auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cal-head {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: 10px;
        }

        .cal-th {
            
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            padding: 8px 0;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .cal-th:first-child,
        .cal-th:last-child {
            color: #D9B45D;
            text-shadow: 0 2px 6px rgba(217, 180, 93, 0.8);
        }

        .cal-body {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cal-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cal-cell:active {
            transform: scale(0.92);
        }

        .cal-cell.other {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cal-cell.today {
            background: rgba(251, 191, 36, 0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(251, 191, 36, 0.6);
            box-shadow: 0 2px 12px rgba(251, 191, 36, 0.4);
        }

        /* 已签到 */
        .cal-cell.signed {
            background: rgba(16, 185, 129, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .cal-cell.signed.today {
            background: rgba(16, 185, 129, 0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(16, 185, 129, 0.8);
            box-shadow: 0 2px 12px rgba(16, 185, 129, 0.5);
        }

        .cnum {
            font-size: 18px;
            color: #fff;
            font-weight: 800;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .cal-cell.other .cnum {
            color: rgba(255, 255, 255, 0.4);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        .cval {
            font-size: 11px;
            color: #fbbf24;
            font-weight: 700;
            margin-top: 3px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        /* 签到勾选标记 */
        .check-mark {
            position: absolute;
            top: 4px;
            right: 4px;
            
            height: 16px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
        }

        /* 签到按钮 */
        .checkin-btn-wrap {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .checkin-btn {
            padding: 14px 48px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            border-radius: 24px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.4);
            transition: all 0.3s;
        }

        .checkin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.5);
        }

        .checkin-btn:active {
            transform: translateY(0);
        }

        .checkin-btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.5);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* iOS原生风格弹窗 */
        .ios-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: #fff;
            border-radius: 13px;
            max-
            
            z-index: 9999;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            overflow: hidden;
        }

        .ios-toast.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            pointer-events: auto;
        }

        .ios-toast-title {
            font-size: 17px;
            font-weight: 400;
            color: #000;
            
            padding: 20px 20px 8px;
            letter-spacing: -0.01em;
        }

        .ios-toast-message {
            font-size: 13px;
            color: #000;
            
            line-height: 1.4;
            padding: 0 20px 20px;
            letter-spacing: -0.01em;
            border-bottom: 0.5px solid #d1d1d6;
        }

        .ios-toast-buttons {
            display: flex;
            border-top: 0.5px solid #d1d1d6;
        }

        .ios-toast-button {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 13px 0;
            background: none;
            border: none;
            font-size: 17px;
            font-weight: 400;
            color: #007aff;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            position: relative;
        }

        .ios-toast-button.only-button {
            border-top: 0.5px solid #d1d1d6;
        }

        .ios-toast-button:active {
            background: rgba(0, 0, 0, 0.05);
        }

    </style>
</head>

<body>

    <div class="top">
        <div class="top-bar">
            <div class="back-btn" onclick="history.back()">‹</div>
            <div class="page-title">每日签到</div>
            <div class="refresh-btn" onclick="loadData()">刷新</div>
        </div>

        <div class="overview">
            <div class="ocard">
                <div class="olabel">今日积分</div>
                <div class="ovalue gold" id="todayPoints">+0</div>
            </div>
            <div class="ocard">
                <div class="olabel">连续签到</div>
                <div class="ovalue" id="continuousDays">0天</div>
            </div>
            <div class="ocard">
                <div class="olabel">本月签到</div>
                <div class="ovalue" id="monthCount">0次</div>
            </div>
        </div>
    </div>

    <div class="main">

        <div class="month-nav">
            <div class="mnav" onclick="prevMonth()">‹</div>
            <div class="mname" id="monthName">2025年 11月</div>
            <div class="mnav" onclick="nextMonth()">›</div>
        </div>

        <div class="cal">
            <div class="cal-head">
                <div class="cal-th">日</div>
                <div class="cal-th">一</div>
                <div class="cal-th">二</div>
                <div class="cal-th">三</div>
                <div class="cal-th">四</div>
                <div class="cal-th">五</div>
                <div class="cal-th">六</div>
            </div>
            <div class="cal-body" id="calBody"></div>
        </div>

        <div class="checkin-btn-wrap">
            <button class="checkin-btn" id="checkinBtn" onclick="doCheckin()">立即签到</button>
        </div>

    </div>

    <nav class="tabbar">
        <a class="tab" href="index.html">
            <div class="ico ico-home"></div>
            <div class="txt">首页</div>
        </a>
        <a class="tab" href="market.html">
            <div class="ico ico-finance"></div>
            <div class="txt">数据</div>
        </a>
        <a class="tab" href="projects.html">
            <div class="ico ico-market"></div>
            <div class="txt">项目</div>
        </a>
        <a class="tab" href="messages.html">
            <div class="ico ico-message"></div>
            <div class="txt">消息</div>
        </a>
        <a class="tab" href="profile.html">
            <div class="ico ico-me"></div>
            <div class="txt">我的</div>
        </a>
    </nav>

    <!-- iOS原生风格弹窗 -->
    <div class="ios-toast" id="iosToast">
        <div class="ios-toast-title" id="iosToastTitle"></div>
        <div class="ios-toast-message" id="iosToastMessage"></div>
        <div class="ios-toast-buttons">
            <div class="ios-toast-button only-button" id="iosToastConfirm">确定</div>
        </div>
    </div>

    <script>
        const API_BASE = window.API_CONFIG?.baseURL || 'https://apis.copla.top';
        let year = new Date().getFullYear(), month = new Date().getMonth() + 1;
        let signData = {}; // 签到数据：{date: {signed: true, points: 10}}
        let signInfo = {}; // 签到信息
        let userData = { token: localStorage.getItem('providence_token') || '' };

        // iOS原生风格弹窗
        function showToast(title, message) {
            const toast = document.getElementById('iosToast');
            const titleEl = document.getElementById('iosToastTitle');
            const msgEl = document.getElementById('iosToastMessage');
            const confirmBtn = document.getElementById('iosToastConfirm');

            titleEl.textContent = title;
            msgEl.textContent = message;
            toast.classList.add('show');

            confirmBtn.onclick = () => {
                toast.classList.remove('show');
            };
        }

        // 加载签到信息
        async function loadSignInfo() {
            try {
                const response = await fetch(API_BASE + '/index.php/user/sign/info', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'token': userData.token
                    }
                });
                const data = await response.json();
                console.log('[签到] API响应:', data);

                if (data.code === 1 && data.data) {
                    signInfo = data.data;
                    updateOverview(data.data);
                    // 更新按钮状态
                    const btn = document.getElementById('checkinBtn');
                    if (data.data.is_signed) {
                        btn.disabled = true;
                        btn.textContent = '今日已签到';
                    } else {
                        btn.disabled = false;
                        btn.textContent = '立即签到 +' + data.data.today_points + '积分';
                    }
                }
            } catch (error) {
                console.error('[签到] 加载签到信息失败:', error);
            }
        }

        // 更新顶部统计
        function updateOverview(data) {
            document.getElementById('todayPoints').textContent = '+' + (data.today_points || 0);
            document.getElementById('continuousDays').textContent = (data.continuous_days || 0) + '天';
            document.getElementById('monthCount').textContent = (data.month_sign_count || 0) + '次';

            console.log('[签到] 更新总览:', data);
        }

        // 执行签到
        async function doCheckin() {
            const btn = document.getElementById('checkinBtn');
            if (btn.disabled) return;

            try {
                btn.disabled = true;
                btn.textContent = '签到中...';

                const response = await fetch(API_BASE + '/index.php/user/sign/sign', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'token': userData.token
                    }
                });
                const data = await response.json();
                console.log('[签到] 签到响应:', data);

                if (data.code === 1) {
                    showToast('签到成功', data.message || '恭喜您，获得' + signInfo.today_points + '积分');
                    // 重新加载数据
                    setTimeout(() => {
                        loadData();
                    }, 1500);
                } else {
                    showToast('签到失败', data.message || '请稍后重试');
                    btn.disabled = false;
                    btn.textContent = '立即签到';
                }
            } catch (error) {
                console.error('[签到] 签到失败:', error);
                showToast('签到失败', '网络错误，请稍后重试');
                btn.disabled = false;
                btn.textContent = '立即签到';
            }
        }

        function render() {
            const first = new Date(year, month - 1, 1).getDay();
            const days = new Date(year, month, 0).getDate();
            const body = document.getElementById('calBody');
            body.innerHTML = '';
            document.getElementById('monthName').textContent = `${year}年 ${month}月`;

            // 上月空格
            for (let i = 0; i < first; i++) {
                const c = document.createElement('div');
                c.className = 'cal-cell other';
                body.appendChild(c);
            }

            const today = new Date();
            const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

            for (let d = 1; d <= days; d++) {
                const c = document.createElement('div');
                const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === todayStr;
                const dayData = signData[dateStr] || {};
                const signed = dayData.signed || false;

                c.className = `cal-cell ${isToday ? 'today' : ''} ${signed ? 'signed' : ''}`;
                c.innerHTML = `<div class="cnum">${d}</div>${signed ? '<div class="check-mark">✓</div>' : ''}`;
                c.onclick = () => {
                    if (signed) {
                        showToast(`${month}月${d}日`, `已签到\n获得积分：${dayData.points || 0}`);
                    } else {
                        showToast(`${month}月${d}日`, '未签到');
                    }
                };
                body.appendChild(c);
            }

            // 如果是当前月，标记今天之前的日期为已签到（模拟）
            if (year === today.getFullYear() && month === today.getMonth() + 1 && signInfo.month_sign_count > 0) {
                // 这里应该从后端获取具体哪些天签到了
                // 暂时只标记今天
                if (signInfo.is_signed) {
                    signData[todayStr] = { signed: true, points: signInfo.today_points || 0 };
                }
                render(); // 重新渲染
            }
        }

        function prevMonth() {
            month--;
            if (month < 1) { month = 12; year-- }
            render();
        }

        function nextMonth() {
            month++;
            if (month > 12) { month = 1; year++ }
            render();
        }

        function loadData() {
            loadSignInfo().then(() => {
                render();
            });
        }

        // 初始化
        loadData();
    </script>
</body>

</html>
