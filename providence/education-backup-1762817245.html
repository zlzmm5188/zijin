<style>
:root{

*{box-sizing:border-box} html,body{height:100%}

body{
  margin:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",Segoe UI,Roboto,Helvetica,Arial,sans-serif;

  background:
    radial-gradient(900px 420px at 120% -10%, rgba(159,139,84,.22), transparent 55%),

}

/* 顶部品牌栏 */
.topbar{position:sticky;top:0;z-index:30;padding:14px 16px;border-bottom:1px solid var(--lineD);
background:linear-gradient(180deg,rgba(10,23,35,.95),rgba(10,23,35,.75));backdrop-filter:blur(6px)}

.brand { display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap; justify-content: flex-start; }

.back-btn{height:24px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;font-size:20px;cursor:pointer;border:none;text-decoration:none}

.back-btn:active{transform:scale(0.95)}

.page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }

.hero h2{margin:0 0 6px;font-size:20px;color:var(--gold2);font-weight:600}

.hero p{margin:0;color:#c9d2dd;font-size:13px;line-height:1.55}

/* 分类选择器（横向3个） */
.category-tabs{
  display:flex;gap:8px;padding:16px 16px 0;
}

.category-tab{
  flex:1;padding:12px 8px;background:rgba(255,255,255,.08);border:1px solid var(--lineD);border-radius:10px;
  color:#c8d2dd;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;
}

.category-tab:active{transform:scale(0.98)}

.category-tab.active{
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  color:#0b1220;border-color:rgba(159,139,84,.6);
}

/* 课程区块容器（白卡） */
.section{
  margin:16px; background:rgba(243,245,247,.96); color:var(--ink);
  border:1px solid var(--lineL); border-radius:var(--radius); box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.section .head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}

.section .head h3{margin:0;font-size:17px;font-weight:600;color:#0f172a}

.section .head small{margin-left:auto;font-size:12px;color:#617087}

/* 课程列表 */
.courses{padding:8px 14px 14px}

/* 课程卡片 - 长方形，像项目卡片 */
.course-card{
  background:#fff;border:1px solid var(--lineL);border-radius:12px;padding:12px;margin-top:10px;cursor:pointer;
  transition:all 0.2s;position:relative;
}

.course-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}

.course-card:active{transform:translateY(0)}

.course-card.locked{opacity:0.5;cursor:not-allowed}

.course-card.locked::after{
  content:'🔒';position:absolute;top:12px;right:12px;font-size:18px;
}

.course-card.completed::after{
  content:'✓';position:absolute;top:12px;right:12px;font-size:18px;color:#22c55e;font-weight:700;
}

.course-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}

.course-header .left{display:flex;align-items:center;gap:8px}

.course-icon{font-size:24px;}

.course-title{font-size:16px;color:#0f172a;font-weight:600;margin:0}

.course-meta{display:flex;gap:16px;margin-top:8px;font-size:12px;color:#6b7280}

.course-meta span{display:flex;align-items:center;gap:4px}

.course-level{display:inline-block;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;
  background:rgba(159,139,84,.15);color:var(--gold);border:1px solid rgba(159,139,84,.3)}

/* 课程详情模态框 */
.course-modal{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;z-index:999;padding:20px;
}

.course-modal.show{display:flex}

.modal-content{
  background:#fff;border-radius:16px;max-max-height:80vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.modal-header{
  padding:20px;border-bottom:1px solid var(--lineL);display:flex;align-items:center;gap:12px;
}

.modal-header .icon{font-size:32px}

.modal-header .info{flex:1}

.modal-header .info h4{margin:0 0 4px;font-size:18px;color:#0f172a;font-weight:600}

.modal-header .info .meta{font-size:12px;color:#6b7280}

.modal-close{
  height:24px;border-radius:50%;background:rgba(0,0,0,.06);border:none;
  font-size:20px;color:#6b7280;cursor:pointer;display:flex;align-items:center;justify-content:center;
}

.modal-close:hover{background:rgba(0,0,0,.12)}

.modal-body{padding:20px;color:#374151;line-height:1.7}

.modal-body h5{margin:20px 0 12px;font-size:16px;color:#0f172a;font-weight:600}

.modal-body p{margin:12px 0}

.modal-body ul{margin:12px 0;padding-left:20px}

.modal-body li{margin:8px 0}

.modal-actions{
  padding:16px 20px;border-top:1px solid var(--lineL);display:flex;gap:12px;
}

.btn-action{
  flex:1;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;
  border:none;transition:all 0.2s;
}

.btn-primary{
  background:linear-gradient(180deg,var(--gold2),var(--gold));color:#0b1220;
  border:1px solid rgba(159,139,84,.6);
}

.btn-primary:active{transform:scale(0.98)}

.btn-secondary{
  background:#f9fafb;color:#6b7280;border:1px solid var(--lineL);
}

.btn-secondary:active{transform:scale(0.98)}

/* 加载状态 */
.loading-state{padding:40px 20px;color:#6b7280}
.spinner{height:24px;border:3px solid rgba(107,114,128,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 底部导航栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(11,59,94,0.98) 0%,rgba(18,76,106,0.98) 100%);backdrop-filter:blur(10px);display:flex;justify-content:space-around;align-items:flex-end;border-top:1px solid rgba(212,175,55,0.2);height:65px;z-index:100;padding:2px 0 2px;box-shadow:0 -2px 16px rgba(0,0,0,.15)}

.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;color:#8b9aa8;text-decoration:none;transition:color .2s ease;position:relative;padding:0;gap:0;-webkit-tap-highlight-color:transparent}

.tab:active .ico{transform:scale(0.92)}

.tab.active{color:#f5d771}

.tab .ico{height:24px;background-size:75%!important;background-position:center!important;background-repeat:no-repeat!important;margin-bottom:0px;transition:transform .15s ease,opacity .15s ease;position:relative;will-change:transform,opacity}

.tab:not(.active) .ico{opacity:0.7}

.tab.active .ico{opacity:1;transform:scale(1.15)}

.tab .txt{font-size:11px;font-weight:600;letter-spacing:0.3px;margin-top:1px;line-height:1;padding-top:0;margin-bottom:2px;color:#8b9aa8}
.tab.active .txt{color:#f5d771;font-weight:600}

.ico-home{background-image:url('img/zy.png?v=1763340588')!important;}
.ico-finance{background-image:url('img/w1.png?v=1763340588')!important;}
.ico-market{background-image:url('img/xm.png?v=1763340588')!important;}
.ico-message{background-image:url('img/34.png?v=1763340588')!important;}
.ico-me{background-image:url('img/wd.png?v=1763340588')!important;}

.footerpad{height:80px}
.brand { display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap; justify-content: flex-start; }      .brand .back-btn { flex: 0 0 auto; margin-right: 8px; }      .brand .page-title, .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }
</style>
</head>

// ========== 学习进度管理 ==========
const PROGRESS_KEY = 'education_progress';

function getProgress() {
  try {
    const data = localStorage.getItem(PROGRESS_KEY);
    return data ? JSON.parse(data) : {};
  } catch {
    return {};
  }
}

function saveProgress(courseId) {
  try {
    const progress = getProgress();
    progress[courseId] = {
      completed: true,
      timestamp: Date.now()
    };
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
    showToast('已完成本课程！');
    return true;
  } catch {
    return false;
  }
}

function isCourseCompleted(courseId) {
  const progress = getProgress();
  return progress[courseId] && progress[courseId].completed;
}

function isCourseUnlocked(course, allCourses) {
  // 第一门课程始终解锁
  if (course.order === 1) return true;
  
  // 检查前一门课程是否完成
  const prevCourse = allCourses.find(c => c.category === course.category && c.order === course.order - 1);
  if (!prevCourse) return true;
  
  return isCourseCompleted(prevCourse.id);
}

// ========== 页面逻辑 ==========
let currentCategory = 'fund';

function init() {
  console.log('✅ 课程数据加载成功！总数:', COURSES.length);
  
  // 分类切换
  document.querySelectorAll('.category-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      currentCategory = this.getAttribute('data-category');
      renderCourses();
    });
  });
  
  // 模态框关闭
  document.getElementById('courseModal').addEventListener('click', function(e) {
    if (e.target === this) {
      closeModal();
    }
  });
  
  // 初始渲染
  renderCourses();
}

function renderCourses() {
  const filtered = COURSES.filter(c => c.category === currentCategory).sort((a, b) => a.order - b.order);
  
  console.log('🎨 渲染分类:', currentCategory, '课程数:', filtered.length);
  
  document.getElementById('courseCount').textContent = `共 ${filtered.length} 门课程`;
  
  const container = document.getElementById('coursesContainer');
  
  if (filtered.length === 0) {
    container.innerHTML = '<div class="loading-state">暂无课程</div>';
    return;
  }
  
  container.innerHTML = filtered.map(course => {
    const completed = isCourseCompleted(course.id);
    const unlocked = isCourseUnlocked(course, COURSES);
    const hasContent = course.content && course.content.intro;
    
    return `
      <div class="course-card ${!unlocked ? 'locked' : ''} ${completed ? 'completed' : ''}" 
           onclick="${unlocked ? `openCourse(${course.id})` : `showToast('请先完成上一课程')`}">
        <div class="course-header">
          <div class="left">
            <span class="course-icon">${course.icon}</span>
            <h4 class="course-title">${course.title}</h4>
          </div>
        </div>
        <div class="course-meta">
          <span class="course-level">${course.level}</span>
          <span>⏱️ ${course.duration}</span>
          <span>📚 ${course.lessons}课时</span>
        </div>
      </div>
    `;
  }).join('');
}

function openCourse(courseId) {
  const course = COURSES.find(c => c.id === courseId);
  if (!course) return;
  
  if (!course.content) {
    showToast('课程内容开发中...');
    return;
  }
  
  const content = course.content;
  const completed = isCourseCompleted(courseId);
  
  const modalHTML = `
    <div class="modal-header">
      <span class="icon">${course.icon}</span>
      <div class="info">
        <h4>${course.title}</h4>
        <div class="meta">${course.level} · ${course.duration} · ${course.lessons}课时</div>
      </div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <p><strong>${content.intro}</strong></p>
      
      <h5>📌 学习目标</h5>
      <ul>
        ${content.objectives.map(obj => `<li>${obj}</li>`).join('')}
      </ul>
      
      ${content.sections.map(section => `
        <h5>${section.title}</h5>
        <p>${section.text}</p>
      `).join('')}
      
      <h5>📝 总结</h5>
      <p>${content.summary}</p>
      
      <h5>🎯 下一步</h5>
      <ul>
        ${content.nextSteps.map(step => `<li>${step}</li>`).join('')}
      </ul>
    </div>
    <div class="modal-actions">
      ${completed ? 
        '<button class="btn-secondary" onclick="closeModal()">关闭</button>' : 
        '<button class="btn-secondary" onclick="closeModal()">稍后学习</button><button class="btn-primary" onclick="completeCourse(' + courseId + ')">标记为已完成</button>'
      }
    </div>
  `;
  
  document.getElementById('modalContent').innerHTML = modalHTML;
  document.getElementById('courseModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('courseModal').classList.remove('show');
  document.body.style.overflow = '';
}

function completeCourse(courseId) {
  saveProgress(courseId);
  closeModal();
  renderCourses();
}

// 页面加载
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
