<!DOCTYPE html>
<html lang="zh-cmn-Hans">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0">
    <title>市场 | PROVIDENCE EQUITY PARTNERS</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css?v=1763343791">
    <script src="config.js?v=1763365517"></script>
    <script src="market.js?v=20250117003" defer></script>
    <style>
        .detail-header,
        .hero-simple,
        .projects-header-theme {
            background: linear-gradient(135deg, #0e2b44, #1a3a5f) !important
        }

        .detail-header-title,
        .back-btn,
        .back-btn-projects {
            color: #fff !important
        }
.brand { display: flex; flex-direction: row; align-items: center; gap: 8px; white-space: nowrap; justify-content: flex-start; }      .brand .back-btn { flex: 0 0 auto; margin-right: 8px; }      .brand .page-title, .brand h1 { margin: 0; display: inline-block; white-space: nowrap; flex: 0 1 auto; }
    </style>
</head>

<body class="page-other">
    <div id="app">
        <!-- 顶部导航 -->
        <header class="hero-simple">
            <div class="hero-top">
                <div class="logo-full">
                    <img src="img/logo.png" alt="PROVIDENCE" class="logo-img-small"
                        onerror="this.style.display='none'" />
                </div>
                <div class="brand">
                    <div class="brand-name">市场数据</div>
                    <span class="live-status" id="last-update-time">
                        <span class="live-dot-small"></span>
                        实时更新中...
                    </span>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="content-other market-content-mobile">
            <!-- 市场标签 -->
            <div class="market-tabs-mobile">
                <button class="market-tab-mobile active" data-section="fund">基金</button>
                <button class="market-tab-mobile" data-section="ipo">IPO</button>
                <button class="market-tab-mobile" data-section="bond">债券</button>
            </div>

            <!-- 基金板块 -->
            <div class="market-section-mobile" id="fund-section">
                <div class="market-list-mobile" id="fund-list">
                    <!-- 基金数据将由JavaScript动态加载 -->
                    <div class="loading-mobile">
                        <div class="loading-spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>

            <!-- IPO板块 -->
            <div class="market-section-mobile hidden" id="ipo-section">
                <div class="market-list-mobile" id="ipo-list">
                    <!-- IPO数据将由JavaScript动态加载 -->
                    <div class="loading-mobile">
                        <div class="loading-spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>

            <!-- 债券板块 -->
            <div class="market-section-mobile hidden" id="bond-section">
                <!-- 债券指数 -->
                <div class="bond-indices" id="bond-indices">
                    <!-- 债券指数将由JavaScript动态加载 -->
                </div>

                <div class="market-list-mobile" id="bond-list">
                    <!-- 债券数据将由JavaScript动态加载 -->
                    <div class="loading-mobile">
                        <div class="loading-spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
            </div>
        </main>

        <!-- 详情弹窗 -->
        <div class="detail-modal" id="detail-modal">
            <div class="detail-overlay" id="detail-overlay"></div>
            <div class="detail-container">
                <div class="detail-header">
                    <button class="detail-back" id="detail-back">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M15 18l-6-6 6-6" />
                        </svg>
                    </button>
                    <h2 class="detail-title" id="detail-title">详情</h2>
                    <div class="detail-actions"></div>
                </div>
                <div class="detail-content" id="detail-content">
                    <!-- 动态内容 -->
                </div>
            </div>
        </div>

        <!-- 底部导航栏 -->
        <nav class="tabbar">
            <a class="tab" href="index.html">
                <div class="ico ico-home"></div>
                <div class="txt">首页</div>
            </a>
            <a class="tab active" href="market.html">
                <div class="ico ico-finance"></div>
                <div class="txt">数据</div>
            </a>
            <a class="tab" href="projects.html">
                <div class="ico ico-market"></div>
                <div class="txt">项目</div>
            </a>
            <a class="tab" href="messages.html">
                <div class="ico ico-message"></div>
                <div class="txt">消息</div>
            </a>
            <a class="tab" href="profile.html">
                <div class="ico ico-me"></div>
                <div class="txt">我的</div>
            </a>
        </nav>
    </div>
</body>

</html>
