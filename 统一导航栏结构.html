<!--
使用说明：
1. 直接复制此结构到页面底部（</body>之前）
2. 为当前页面的tab添加 active 类
3. 不要添加任何内联样式
4. 让 styles.css 中的样式生效

示例：
- index.html: 给第1个tab添加 active
- market.html: 给第2个tab添加 active
- projects.html: 给第3个tab添加 active
- messages.html: 给第4个tab添加 active
- profile.html: 给第5个tab添加 active
